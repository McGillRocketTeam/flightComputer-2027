[platformio]
    default_envs = flightComputer
    src_dir = .

[common]
    build_flags =
        -std=gnu11
        -g3
        -O0
        -Os
        -ffunction-sections
        -fdata-sections
        -Wall
        -fstack-usage
        --specs=nano.specs
        -DSTM32

[env:flightComputer]
    platform = ststm32
    framework = stm32cube
    board = flightComputer
    include = fc/Inc

    ; PlatformIO uses this directory to look for the libs listed below
    lib_extra_dirs =
        fc/lib

    lib_deps = 
        FatFS = file://fc/lib/FatFS
        FreeRTOS = file://fc/lib/FreeRTOS
        ST_USB = file://fc/lib/STM32_USB_Device_Library
        mbed-jsoh91/Eigen
        jgromes/RadioLib@^7.7.1

    build_src_filter = 
        -<*>
        +<fc/MRT/**>

        +<fc/Src> ; Compile all HAL Drivers

        +<modules/**>

    lib_ldf_mode = deep+

    extra_scripts = pre:fc/force_fpu.py

    board_build.stm32cube.custom_config_header = yes

    monitor_speed = 115200
    monitor_filters = direct

    ; Build options
    build_flags =
        ${common.build_flags}
        -I fc/MRT       
        -I modules
        -I modules/telemetry/generated

        ; Includes for FreeRTOS headers
        -I fc/lib/FreeRTOS/Source/include
        -I fc/lib/FreeRTOS/Source/CMSIS_RTOS_V2
        -I fc/lib/FreeRTOS/Source/portable/GCC/ARM_CM4F

        ; Includes for FatFS headers
        -I fc/FATFS/App
        -I fc/FATFS/Target

        ; FPU Config
        -mfloat-abi=hard
        -mfpu=fpv4-sp-d16
        -Wl,-u,_printf_float
        -DSTM32F4xx

        -D RADIOLIB_EXCLUDE_APRS=1
        -D RADIOLIB_STATIC_ONLY=1

        ; For compile time reduction, exlude all modules except SX126x, and all protocols except LoRa
        -D RADIOLIB_EXCLUDE_CC1101
        -D RADIOLIB_EXCLUDE_NRF24
        -D RADIOLIB_EXCLUDE_RF69
        -D RADIOLIB_EXCLUDE_SX1231
        -D RADIOLIB_EXCLUDE_SI443X
        -D RADIOLIB_EXCLUDE_RFM2X
        -D RADIOLIB_EXCLUDE_SX127X
        -D RADIOLIB_EXCLUDE_SX128X
        -D RADIOLIB_EXCLUDE_LR11X0

        -D RADIOLIB_EXCLUDE_AFSK
        -D RADIOLIB_EXCLUDE_AX25
        -D RADIOLIB_EXCLUDE_APRS
        -D RADIOLIB_EXCLUDE_HELLSCHREIBER
        -D RADIOLIB_EXCLUDE_MORSE
        -D RADIOLIB_EXCLUDE_RTTY
        -D RADIOLIB_EXCLUDE_SSTV
        -D RADIOLIB_EXCLUDE_FSK4
        -D RADIOLIB_EXCLUDE_BELL
        -D RADIOLIB_EXCLUDE_PAGER
        -D RADIOLIB_EXCLUDE_LORAWAN

[env:prop_top]
    platform = ststm32>=20.0.0
    framework = stm32cube
    board = propulsionController

    lib_extra_dirs =
        prop_top/MRT

    lib_ldf_mode = deep+

    build_src_filter = 
        -<*>
        +<prop_top/MRT/**>

        +<prop_top/Src> ; Compile all HAL Drivers

    ; Build options
    build_flags =
        ${common.build_flags}
        -I prop_top/Inc
        -I prop_top/MRT

        -I Drivers

    ; Serial Monitor options
    monitor_speed = 115200

[env:prop_bottom]
    platform = ststm32>=20.0.0
    framework = stm32cube
    board = propulsionController

    lib_extra_dirs =
        prop_bottom/MRT

