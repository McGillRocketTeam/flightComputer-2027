[platformio]
    default_envs = flightComputer
    src_dir = .

[common]
    build_flags =
        -std=gnu11
        -g3
        -O0
        -ffunction-sections
        -fdata-sections
        -Wall
        -fstack-usage
        --specs=nano.specs


[env:flightComputer]
    platform = ststm32
    framework = stm32cube
    board = nucleo_f446re

    ; Build options
    build_flags =
        ${common.build_flags}
        -IInc
        -DSTM32F4xx

    debug_tool = stlink

    ; Serial Monitor options
    monitor_speed = 115200
